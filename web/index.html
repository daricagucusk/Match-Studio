/* V2.4.1 — MATCH OPERATIONS: decisive, readable, fold-friendly. */
:root {--v22-leaf:#75d49b;--v22-surface:#1b2b23;--v22-edge:#3a5143;--v22-ink:#edf5ef}
.v22-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0 0 18px}

.v22-metrics strong{font-size:32px;letter-spacing:-.05em;color:#f5fff6;font-variant-numeric:tabular-nums;line-height:1.12}
.v22-metrics strong small{color:#9cc2ab;font-size:15px;letter-spacing:0}
.v22-metrics .metric-risk{border-color:#d99f6c}

.group-chip.active{background:#326a49;border-color:#8ec99d;color:#fff;box-shadow:inset 0 0 0 1px #6bb98a44}
