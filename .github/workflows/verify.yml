name: Verify Match Studio release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests for safe AI failover (no API key required)
        run: python3 -m unittest discover -s tools -p 'test_ai_handoff_router.py' -v
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run release
      - run: npm run build:vercel
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: match-studio-release
          path: |
            dist/*_PWA.zip
            dist/*_Source.zip
            dist/SHA256SUMS.txt
            dist/release.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-diagnostics
          path: test-results/
