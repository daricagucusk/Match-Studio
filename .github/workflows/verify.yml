name: Verify Match Studio release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Fail closed on source credentials
        run: node tools/release-security-check.cjs
      - name: Unit tests for safe AI failover (no API key required)
        run: python3 -m unittest discover -s tools -p 'test_ai_handoff_router.py' -v
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high
      - run: npm run release
      - run: npm run build:vercel
      - name: Fail closed on published static files
        run: node tools/release-security-check.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && vars.MATCHSTUDIO_UPLOAD_RELEASE_ARTIFACTS == 'true'
        with:
          name: match-studio-release
          path: |
            dist/*_PWA.zip
            dist/*_Source.zip
            dist/SHA256SUMS.txt
            dist/release.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && vars.MATCHSTUDIO_UPLOAD_RELEASE_ARTIFACTS == 'true'
        with:
          name: matchstudio-play-store-screenshots
          path: dist/store-listing/*.png
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && vars.MATCHSTUDIO_UPLOAD_RELEASE_ARTIFACTS == 'true'
        with:
          name: browser-test-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
