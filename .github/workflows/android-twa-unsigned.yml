name: Android TWA unsigned build QA

# This checks Android compilation ONLY. It never uploads to Google Play or signs.
on:
  pull_request:
    paths:
      - 'android/**'
      - 'tools/ensure-android-api36.cjs'
      - 'tools/inspect-android-aab.py'
      - 'tools/test_android_aab.py'
      - '.github/workflows/android-twa-unsigned.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android 16 platform and build tools
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli
      - name: Generate TWA project without creating signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .unsigned-twa ~/.bubblewrap
          cp android/twa-manifest.json .unsigned-twa/twa-manifest.json
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json
          cd .unsigned-twa
          bubblewrap update --skipVersionUpgrade
      - name: Enforce target and compile API 36 on generated Gradle build
        run: node tools/ensure-android-api36.cjs .unsigned-twa
      - name: Build unsigned QA bundle (not for Play upload)
        shell: bash
        run: |
          set -euo pipefail
          cd .unsigned-twa
          # Generated Gradle project inherits the hidden QA folder name unless set.
          printf "\nrootProject.name = 'matchstudio-android'\n" >> settings.gradle
          chmod +x ./gradlew
          ./gradlew --no-daemon bundleRelease
          bundle="$(find . -type f -name '*.aab' -size +100k -print -quit)"
          if [[ -z "$bundle" ]]; then
            echo "Unsigned Android App Bundle not produced."
            exit 1
          fi
          cp "$bundle" unsigned-qa.aab
          echo "Generated unsigned QA bundle: $(wc -c < unsigned-qa.aab) bytes"
      - name: Inspect built bundle identity, API and unsigned state
        # Inspect the artifact itself; a successful Gradle task alone is insufficient.
        run: |
          curl -fLsS https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar -o "$RUNNER_TEMP/bundletool.jar"
          echo "378b5434cd1378bef6b2bc527b8c7f0ff2584b273830335bce54d6d0813c8584  $RUNNER_TEMP/bundletool.jar" | sha256sum -c -
          python3 -m unittest discover -s tools -p 'test_android_aab.py' -v
          python3 tools/inspect-android-aab.py --aab .unsigned-twa/unsigned-qa.aab --bundletool "$RUNNER_TEMP/bundletool.jar" --mode unsigned --commit "$(git rev-parse HEAD)" --report .unsigned-twa/aab-report.json
      # GitHub artifact quota may be exhausted. QA build and inspection remain mandatory,
      # but archive export is explicitly opt-in for manual dispatches only.
      - name: Upload inspected unsigned QA bundle
        if: ${{ github.event_name == 'workflow_dispatch' && vars.MATCHSTUDIO_UPLOAD_RELEASE_ARTIFACTS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: matchstudio-android-unsigned-qa
          path: |
            .unsigned-twa/unsigned-qa.aab
            .unsigned-twa/aab-report.json
          if-no-files-found: error
          retention-days: 5
