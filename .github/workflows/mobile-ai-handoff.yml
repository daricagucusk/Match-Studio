name: Mobile AI Handoff Pilot

on:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: mobile-ai-handoff-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  generate:
    name: Generate isolated code patch
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[AI DEVIR]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout current main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate safe multi-model routing (offline unit tests)
        run: python -m unittest discover -s tools -p 'test_ai_handoff_router.py' -v

      - name: Generate code with bounded multi-provider fallback
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_ENABLE_PAID_FALLBACK: ${{ vars.AI_ENABLE_PAID_FALLBACK || 'false' }}
        run: python tools/ai_handoff_router.py

      - name: Enforce pilot scope and export patch
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "::error::The agent changed Git HEAD."; exit 1; }
          printf '\n/.gemini/\n/gemini-artifacts/\n/gemini-cli/\n/gha-creds-*.json\n' >> .git/info/exclude
          git add -N .
          if [ -n "$(git diff --name-only --diff-filter=DR HEAD)" ]; then
            echo "::error::File removals and renames are not allowed in this pilot."
            exit 1
          fi
          count=0
          while IFS= read -r -d '' path; do
            count=$((count+1))
            case "$path" in
              src/*|tests/*|web/*)
                ;;
              *)
                echo "::error::File outside pilot source allowlist: $path"
                exit 1
                ;;
            esac
          done < <(git diff --name-only -z HEAD)
          test "$count" -gt 0 || { echo "::error::Agent made no source edits."; exit 1; }
          git diff --binary HEAD > "$RUNNER_TEMP/mobile-handoff.patch"
          test "$(wc -c < "$RUNNER_TEMP/mobile-handoff.patch")" -le 200000 || {
            echo "::error::Patch exceeds pilot 200 KB review limit."
            exit 1
          }

      - name: Validate application changes
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npm run build
          npm test

      - name: Transfer reviewed patch to publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-ai-handoff-patch
          path: ${{ runner.temp }}/mobile-handoff.patch
          if-no-files-found: error
          retention-days: 3

  draft-pr:
    name: Open draft PR, never deploy
    needs: generate
    if: needs.generate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout current main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download isolated patch
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mobile-ai-handoff-patch
          path: ${{ runner.temp }}/handoff-artifacts

      - name: Apply patch and push feature branch
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/handoff-artifacts/mobile-handoff.patch"
          git apply --check "$patch"
          branch="agent/mobile-handoff-${ISSUE_NUMBER}-${RUN_ID}"
          git switch -c "$branch"
          git apply "$patch"
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(agent): draft issue #${ISSUE_NUMBER} changes"
          git push -u origin "$branch"
          echo "BRANCH=$branch" >> "$GITHUB_ENV"

      - name: Open draft pull request for human review
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr create \
            --draft \
            --base main \
            --head "$BRANCH" \
            --title "[AI Devri] Issue #$ISSUE_NUMBER - kod önerisi" \
            --body "Closes #$ISSUE_NUMBER only if manually merged. Generated by the Mobile AI Handoff pilot. Build and unit tests passed before opening this draft. Existing verify CI on the PR must also pass. Review every file; do not merge without owner approval. No production deployment was requested."

      - name: Dispatch full release CI for bot-authored PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run verify.yml --ref "$BRANCH"
